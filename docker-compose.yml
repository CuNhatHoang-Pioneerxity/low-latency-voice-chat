# Remove the version: '3.8' line as per the warning
services:
  # FastAPI Server (xAI + Deepgram - no GPU needed)
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: poineerxitydev/omni:fb-vc-server-latest
    container_name: voice-chat-server
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_AUDIO_QUEUE_SIZE=${MAX_AUDIO_QUEUE_SIZE:-50}
      - TTS_START_ENGINE=xai
      - LLM_START_PROVIDER=xai
      - LLM_START_MODEL=grok-3
      # API Keys (set these in .env or environment)
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
    restart: unless-stopped

  # Client (Vite + React with nginx)
  client:
    build:
      context: client
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=wss://omni-api.pioneerxity.ai
#        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-ws://localhost:8000}
#    image: poineerxitydev/omni:fb-vc-client-latest
    container_name: voice-chat-client
    ports:
      - "3030:80"
    restart: unless-stopped